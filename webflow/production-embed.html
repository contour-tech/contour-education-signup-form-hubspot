<!--
  Contour Form 1 — PRODUCTION Webflow Code Embed.
  Paste this into the contact-form_embed Code Embed on the *production*
  Free Trial page (contoureducation.com.au/free-trial-hubspot).

  The only difference from embed.html is the form1.js src: this one loads
  js/prod/form1.js, a second copy on the same GitHub Pages site that a push
  to main never touches. Only the "Promote to production" workflow writes it,
  and only from a version tag — so production moves when a release is cut,
  not when someone pushes.

  Staging (webflow/embed.html) keeps js/form1.js and still auto-updates on
  every push to main — that is the place to test.

  Because the URL is stable, this page never needs republishing again: a
  release updates what the URL serves (~30-60s, browser cache max 10 min).

  To ship a version to production:
    1. Verify on staging.
    2. git tag vX.Y.Z && git push origin vX.Y.Z
    3. Two workflows run: release-jsdelivr records the immutable tag URL,
       promote-to-production copies that tag's form1.js to js/prod/form1.js.
    4. Nothing to do here.

  To roll back: run the "Promote to production" workflow by hand with the
  previous tag. The pinned jsDelivr tag URLs stay available as an emergency
  fallback if Pages itself is the problem:
    https://cdn.jsdelivr.net/gh/contour-tech/contour-education-signup-form-hubspot@v1.1.1/js/form1.js

  CSS stays in the Webflow page header code — unchanged.
  The Cal.com booking widget script on the page is separate — do not touch.
-->

  <script>

-->
